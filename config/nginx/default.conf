server {
  listen 80;
  listen 443 ssl;
  client_max_body_size 100m;
  server_name wiki.fateev.moscow;

  ssl_certificate /etc/nginx/conf.d/letsencrypt/certificates/wiki.fateev.moscow.crt;
  ssl_certificate_key /etc/nginx/conf.d/letsencrypt/certificates/wiki.fateev.moscow.key;

  # Outline Wiki
  location / {
    include /etc/nginx/conf.d/include/proxy.conf;
    proxy_pass http://wk-outline:3000;
  }

  # Static file FOR OIDC Server
  location /uc/static {
    alias /uc/static_root;
  }

  # OIDC Server
  location /uc {
    include /etc/nginx/conf.d/include/proxy.conf;
    proxy_set_header SCRIPT_NAME /uc;
    proxy_pass http://wk-oidc-server:8000;
  }

  location /.well-known/acme-challenge/ {
    root /etc/nginx/conf.d;
  }
}

